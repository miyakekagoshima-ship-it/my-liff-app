<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>よか茶レ！ 初回測定会</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; color: #333; text-align: center; }
        h2 { font-size: 20px; color: #2c3e50; line-height: 1.4; margin-bottom: 20px; }
        
        /* ★ 受付終了メッセージ用のスタイル */
        .closed-box { background-color: #fff; padding: 30px 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top: 5px solid #d93025; margin-bottom: 20px; }
        .closed-title { color: #d93025; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .closed-text { font-size: 15px; line-height: 1.6; color: #444; }

        .info-box { font-size: 14px; color: #555; line-height: 1.6; text-align: left; background-color: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px; }
        
        .close-btn { width: 100%; padding: 15px; background-color: #666; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>よか茶レ！ 初回測定会</h2>
    
    <!-- ★ 受付終了のメッセージ -->
    <div class="closed-box">
        <div class="closed-title">受付を終了いたしました</div>
        <div class="closed-text">
            ご好評につき、定員に達したため<br>参加お申し込みの受付を終了いたしました。<br><br>
            たくさんのお申し込み、誠にありがとうございました。
        </div>
    </div>

    <!-- ★ 申し込み済みの方への案内 -->
    <div class="info-box">
        ⚠️ <strong>すでにお申し込みいただいた皆様へ</strong><br>
        参加時間が確定し次第、<strong>11月19日（木）まで</strong>に、本LINEアカウントより個別にご案内メッセージをお送りいたしますので、今しばらくお待ちください。
    </div>

    <button class="close-btn" onclick="liff.closeWindow()">画面を閉じる</button>

    <script>
        // ★ フォームは不要なので、LIFF初期化処理のみ残します（閉じるボタンなどを機能させるため）
        liff.init({ liffId: "2010463622-5b0fgy7n" }).catch(err => {
            console.error("LIFF Initialization failed ", err);
        });
    </script>
</body>
</html>
